<title>Interactive image gallery</title>

<div class="gallery-container w-full px-5 py-5 flex justify-center box-border">
  <p id="gallery-instructions" class="sr-only">
    Image gallery. You can reorder images using drag and drop. Each image has a delete button.
  </p>

  <div class="sr-only" aria-live="polite" aria-atomic="true">
    {{ liveMessage() }}
  </div>

  <div
    class="gallery-grid grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-[18px] w-full max-w-[1300px]"
    role="list"
    cdkDropList
    cdkDropListOrientation="mixed"
    aria-describedby="gallery-instructions"
    (cdkDropListDropped)="drop($event)"
  >
    @for (img of images(); track img.id;) {
    <app-image-item
      cdkDrag
      [image]="img"
      [featured]="img.featured"
      (imageDelete)="onTrashClick($event)"
    ></app-image-item>
    }
  </div>
</div>
