<div
  tabindex="0"
  role="button"
  (keydown.enter)="onKeyPress()"
  (keydown.space)="onKeyPress()"
  [class]="
    featured()
      ? 'image-item block overflow-hidden rounded-xl cursor-pointer md:hover:origin-top-left md:hover:scale-[2.05] hover:border-4 hover:border-inset hover:border-gray-500 hover:rounded-lg'
      : 'image-item block overflow-hidden rounded-xl cursor-pointer md:hover:-translate-y-1 md:hover:scale-[1.03] hover:border-4 hover:border-inset hover:border-gray-500 hover:rounded-lg'
  "
>
  <img [src]="image().url" [alt]="image().alt" class="w-full h-full object-cover block" />
</div>
